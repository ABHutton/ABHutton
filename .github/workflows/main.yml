name: Metrics
on:
  # Weekly updates (Sundays 00:00 UTC)
  schedule:
    - cron: "0 0 * * 0"
  # (optional) Run workflow manually
  workflow_dispatch:
  # (optional) Run workflow when pushing on master/main
  push:
    branches: ["master", "main"]
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    env:
      # Recolours the "classic" template and isocalendar for GitHub's dark theme
      DARK_CSS: >-
        svg { color: #8b949e !important; }
        h1, h2, h3 { color: #58a6ff !important; }
        .label { color: #58a6ff !important; }
        footer, .field.language.details small { color: #8b949e !important; }
        [fill="#ebedf0"] { fill: #161b22 !important; }
        [fill="#9be9a8"] { fill: #0e4429 !important; }
        [fill="#40c463"] { fill: #006d32 !important; }
        [fill="#30a14e"] { fill: #26a641 !important; }
        [fill="#216e39"] { fill: #39d353 !important; }
    steps:
      # Each render only writes to /metrics_renders (output_action: none);
      # the last step commits everything in one go.
      - name: General metrics
        uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none
          config_timezone: Africa/Johannesburg

      - name: General metrics (dark)
        uses: lowlighter/metrics@v3.34
        with:
          filename: github-metrics-dark.svg
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none
          config_timezone: Africa/Johannesburg
          extras_css: ${{ env.DARK_CSS }}

      - name: Full-year calendar
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none
          config_timezone: Africa/Johannesburg
          base: ""
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: full-year

      - name: Full-year calendar (dark)
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.isocalendar-dark.svg
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none
          config_timezone: Africa/Johannesburg
          extras_css: ${{ env.DARK_CSS }}
          base: ""
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: full-year

      # Plain (non-indepth) languages: based on repo byte counts, so it can't time out
      - name: Languages
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none
          base: ""
          plugin_languages: "yes"
          plugin_languages_limit: 6

      - name: Languages (dark)
        uses: lowlighter/metrics@v3.34
        with:
          filename: metrics.languages-dark.svg
          token: ${{ secrets.METRICS_TOKEN }}
          output_action: none
          extras_css: ${{ env.DARK_CSS }}
          base: ""
          plugin_languages: "yes"
          plugin_languages_limit: 6

      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit renders
        run: |
          cp /metrics_renders/*.svg .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.svg
          git diff --cached --quiet || git commit -m "Update metrics [skip ci]"
          git push
